[package]
name = "common"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cookie = "0.18"
time = { version = "0.3", features = ["formatting"] }
sha2 = "0.10"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
