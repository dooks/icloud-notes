[package]
name = "spike1-login"
version = "0.1.0"
edition = "2024"

[lib]
name = "spike1_login_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
