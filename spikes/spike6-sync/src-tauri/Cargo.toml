[package]
name = "spike6-sync"
version = "0.1.0"
edition = "2024"

[lib]
name = "spike6_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "cookies"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
