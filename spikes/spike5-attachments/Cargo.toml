[package]
name = "spike5-attachments"
version = "0.1.0"
edition = "2024"
default-run = "fetch"

[lib]
name = "spike5"
path = "src/lib.rs"

[[bin]]
name = "analyze"
path = "src/bin/analyze.rs"

[[bin]]
name = "fetch"
path = "src/bin/fetch.rs"

[dependencies]
base64 = "0.23.1"
flate2 = "1.1.10"
prost = "0.14.4"
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tauri = { version = "2", features = [] }
reqwest = { version = "0.12", features = ["blocking", "json", "cookies"] }

[build-dependencies]
prost-build = "0.14.4"
protox = "0.10.0"
tauri-build = { version = "2", features = [] }
