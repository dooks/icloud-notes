<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- StarNotes app icon. Sibling of StarMail's (stardust-mail/assets/starmail-icon.svg):
       same tile, stardust and gold star, with a notepad in place of the envelope and a
       violet-to-crimson sky in place of the navy one. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#2b1a55"/>
      <stop offset="0.5" stop-color="#5a1f5e"/>
      <stop offset="1" stop-color="#d42a4a"/>
    </linearGradient>
    <radialGradient id="nebula" cx="0.74" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#ff9ec4" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#a04cff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#a04cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6e6ee"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0436a"/>
      <stop offset="1" stop-color="#b02a62"/>
    </linearGradient>
    <radialGradient id="gold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbe8"/>
      <stop offset="0.35" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#ffb02e"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="tile">
      <rect width="1024" height="1024" rx="224"/>
    </clipPath>
    <clipPath id="page">
      <rect x="170" y="300" width="580" height="590" rx="56"/>
    </clipPath>
    <!-- Knock the notepad out around the big star so the two read as separate shapes. -->
    <mask id="cut">
      <rect width="1024" height="1024" fill="#fff"/>
      <path d="M750 110 Q776 294 960 320 Q776 346 750 530 Q724 346 540 320 Q724 294 750 110 Z"
            fill="#000" stroke="#000" stroke-width="56" stroke-linejoin="round"/>
    </mask>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#nebula)"/>

    <!-- stardust -->
    <g fill="#ffffff">
      <path d="M250 120 Q256 164 300 170 Q256 176 250 220 Q244 176 200 170 Q244 164 250 120 Z" opacity="0.85"/>
      <path d="M110 300 Q113 322 135 325 Q113 328 110 350 Q107 328 85 325 Q107 322 110 300 Z" opacity="0.6"/>
      <circle cx="420" cy="150" r="9" opacity="0.55"/>
      <circle cx="880" cy="650" r="11" opacity="0.5"/>
      <circle cx="100" cy="600" r="7" opacity="0.4"/>
      <circle cx="880" cy="880" r="8" opacity="0.35"/>
      <circle cx="560" cy="220" r="6" opacity="0.45"/>
    </g>

    <!-- notepad -->
    <g mask="url(#cut)">
      <rect x="170" y="318" width="580" height="590" rx="56" fill="#1a0b2e" opacity="0.35"
            filter="url(#shadow)"/>
      <g clip-path="url(#page)">
        <rect x="170" y="300" width="580" height="590" fill="url(#paper)"/>
        <rect x="170" y="300" width="580" height="120" fill="url(#band)"/>
      </g>
      <g stroke="#c9a3b8" stroke-width="30" stroke-linecap="round">
        <line x1="250" y1="530" x2="670" y2="530"/>
        <line x1="250" y1="640" x2="670" y2="640"/>
        <line x1="250" y1="750" x2="520" y2="750"/>
      </g>
    </g>

    <!-- star -->
    <circle cx="750" cy="320" r="150" fill="#ffc24a" opacity="0.55" filter="url(#glow)"/>
    <path d="M750 110 Q776 294 960 320 Q776 346 750 530 Q724 346 540 320 Q724 294 750 110 Z"
          fill="url(#gold)"/>
  </g>
</svg>
